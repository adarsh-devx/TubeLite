[package]
name = "tubelite-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "tubelite_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "tubelite-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-ytdlp = { path = "plugins/yt-dlp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "macros", "io-util", "time"] }
once_cell = "1"
dirs = "6"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
